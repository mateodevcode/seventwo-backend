# === nginx: seventwo-api — api.seventwo.tech (proxy total al backend) ===
# Backend Node en contenedor: 127.0.0.1:4000 (/auth, /health, ...).
# Certificado independiente: /etc/letsencrypt/live/api.seventwo.tech/
# Lo instala el workflow .github/workflows/deploy.yml en
# /etc/nginx/sites-available/seventwo-api (+ symlink en sites-enabled).

# --- HTTP → HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name api.seventwo.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.seventwo.tech;

    ssl_certificate /etc/letsencrypt/live/api.seventwo.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.seventwo.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # La API solo recibe JSON pequeño (express.json limit 100kb).
    client_max_body_size 1M;
    gzip on;
    gzip_types application/json;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # El backend usa trust proxy = 1: req.ip sale de X-Forwarded-For
        # (rate limit por IP). Un solo salto: este nginx.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
