# seventwo-backend en VPS: /srv/infra/seventwo/seventwo-backend
# La API se une a la red donde vive postgres_central (central_network, igual
# que inmobitwo) y solo escucha en 127.0.0.1: nginx hace de proxy TLS para
# api.seventwo.tech (nginx/seventwo-api.conf).
# Las migraciones se aplican al arrancar el contenedor (CMD del Dockerfile).
services:
  api:
    build: .
    container_name: seventwo-backend
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped
    networks:
      - central_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  central_network:
    external: true
